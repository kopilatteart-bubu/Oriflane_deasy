<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oriflame Inventory System</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

      body {
        font-family: 'Inter', sans-serif;
      }

      .glass-panel {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(8px);
      }
    </style>
  </head>
  <body class="bg-slate-100 text-slate-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;

      const STORAGE_KEY = 'oriflame_inventory_data_v2';
      const DEFAULT_CATEGORIES = ['Semua', 'Skincare', 'Makeup', 'Fragrance', 'Personal Care', 'Wellness'];

      const PRESET_PRODUCTS = [
        { id: 'ORI-001', name: 'Tender Care Protecting Balm with Organic Honey', category: 'Skincare', price: 49900, stock: 45, minStock: 10, unit: 'pcs', description: 'Balsam serbaguna untuk melembapkan dan melindungi kulit dengan kandungan madu organik.' },
        { id: 'ORI-002', name: 'NovAge Ultimate Lift Contour Define Day Cream SPF 15', category: 'Skincare', price: 579000, stock: 12, minStock: 5, unit: 'pcs', description: 'Krim siang pengencang wajah dengan perlindungan SPF 15.' },
        { id: 'ORI-003', name: 'Giordani Gold Man Anti-perspirant Roll-On Deodorant', category: 'Personal Care', price: 69900, stock: 28, minStock: 8, unit: 'pcs', description: 'Deodoran roll-on pria dengan aroma premium dan efek tahan lama.' },
        { id: 'ORI-004', name: 'Eclat Amour Eau de Toilette', category: 'Fragrance', price: 429000, stock: 8, minStock: 5, unit: 'pcs', description: 'Wewangian romantis dengan aroma white violet dan cedarwood.' },
        { id: 'ORI-005', name: 'Love Nature Purifying Gel Wash with Organic Tea Tree & Lime', category: 'Skincare', price: 89900, stock: 30, minStock: 10, unit: 'pcs', description: 'Pembersih wajah gel yang membantu membersihkan dan menyeimbangkan kulit.' },
        { id: 'ORI-006', name: 'Giordani Gold Iconic Liquid Lipstick SPF 15 - Elixir', category: 'Makeup', price: 219000, stock: 15, minStock: 5, unit: 'pcs', description: 'Lipstik cair berkilau dengan perlindungan SPF 15.' },
        { id: 'ORI-007', name: 'Wellosophy Omega 3', category: 'Wellness', price: 349000, stock: 20, minStock: 5, unit: 'botol', description: 'Suplemen minyak ikan berkualitas tinggi kaya EPA dan DHA.' },
        { id: 'ORI-008', name: 'Milk & Honey Gold Smoothing Sugar Scrub', category: 'Personal Care', price: 159000, stock: 18, minStock: 6, unit: 'pcs', description: 'Scrub gula eksfoliasi mewah dengan aroma susu dan madu.' }
      ];

      const emptyFormData = {
        id: '',
        name: '',
        category: 'Skincare',
        price: '',
        stock: '',
        minStock: '5',
        unit: 'pcs',
        description: ''
      };

      const Icon = ({ name, size = 18, className = '' }) => {
        useEffect(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        }, [name, size, className]);

        return (
          <i
            data-lucide={name}
            style={{ width: size, height: size }}
            className={`inline-block ${className}`}
          ></i>
        );
      };

      const safeNumber = (value, fallback = 0) => {
        const num = Number(value);
        return Number.isFinite(num) ? num : fallback;
      };

      const formatRupiah = (value) => {
        return new Intl.NumberFormat('id-ID', {
          style: 'currency',
          currency: 'IDR',
          maximumFractionDigits: 0
        }).format(Math.max(0, safeNumber(value, 0)));
      };

      const getInitialProducts = () => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (!saved) return PRESET_PRODUCTS;
          const parsed = JSON.parse(saved);
          return Array.isArray(parsed) && parsed.length ? parsed : PRESET_PRODUCTS;
        } catch (error) {
          return PRESET_PRODUCTS;
        }
      };

      function App() {
        const [products, setProducts] = useState(getInitialProducts);
        const [searchQuery, setSearchQuery] = useState('');
        const [selectedCategory, setSelectedCategory] = useState('Semua');
        const [isFormOpen, setIsFormOpen] = useState(false);
        const [editingProduct, setEditingProduct] = useState(null);
        const [deleteId, setDeleteId] = useState(null);
        const [toast, setToast] = useState(null);
        const [formData, setFormData] = useState(emptyFormData);
        const [formErrors, setFormErrors] = useState({});

        useEffect(() => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
          } catch (error) {
            console.warn('Could not save inventory to localStorage', error);
          }
        }, [products]);

        useEffect(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        }, [products, isFormOpen, toast]);

        useEffect(() => {
          if (!toast) return undefined;
          const timer = setTimeout(() => setToast(null), 2800);
          return () => clearTimeout(timer);
        }, [toast]);

        const showToast = (message, type = 'success') => {
          setToast({ message, type });
        };

        const categories = useMemo(() => {
          const unique = [...new Set(products.map((item) => item.category).filter(Boolean))];
          return ['Semua', ...unique];
        }, [products]);

        const stats = useMemo(() => {
          const totalSKU = products.length;
          const totalItems = products.reduce((sum, item) => sum + safeNumber(item.stock, 0), 0);
          const totalValue = products.reduce((sum, item) => sum + safeNumber(item.price, 0) * safeNumber(item.stock, 0), 0);
          const lowStockCount = products.filter((item) => safeNumber(item.stock, 0) <= safeNumber(item.minStock, 0)).length;

          return { totalSKU, totalItems, totalValue, lowStockCount };
        }, [products]);

        const filteredProducts = useMemo(() => {
          const query = searchQuery.trim().toLowerCase();

          return products.filter((product) => {
            const matchesSearch = !query ||
              product.name.toLowerCase().includes(query) ||
              product.id.toLowerCase().includes(query);

            const matchesCategory = selectedCategory === 'Semua' || product.category === selectedCategory;
            return matchesSearch && matchesCategory;
          });
        }, [products, searchQuery, selectedCategory]);

        const validateProduct = (data) => {
          const errors = {};
          const trimmedId = data.id.trim();
          const trimmedName = data.name.trim();
          const trimmedCategory = data.category.trim();
          const price = safeNumber(data.price, NaN);
          const stock = safeNumber(data.stock, NaN);
          const minStock = safeNumber(data.minStock, NaN);
          const unit = data.unit.trim();

          if (!trimmedId) errors.id = 'ID produk wajib diisi.';
          if (!trimmedName) errors.name = 'Nama produk wajib diisi.';
          if (!trimmedCategory) errors.category = 'Kategori wajib diisi.';
          if (!Number.isFinite(price) || price <= 0) errors.price = 'Harga harus lebih dari 0.';
          if (!Number.isFinite(stock) || stock < 0) errors.stock = 'Stok tidak boleh negatif.';
          if (!Number.isFinite(minStock) || minStock < 0) errors.minStock = 'Minimal stok tidak boleh negatif.';
          if (!unit) errors.unit = 'Satuan wajib diisi.';

          if (!Number.isFinite(stock) || !Number.isFinite(minStock)) return errors;
          if (stock < minStock) {
            errors.stock = 'Stok tidak boleh lebih kecil dari minimum stok.';
          }

          return errors;
        };

        const openCreateForm = () => {
          setEditingProduct(null);
          setFormData({ ...emptyFormData });
          setFormErrors({});
          setIsFormOpen(true);
        };

        const openEditForm = (product) => {
          setEditingProduct(product);
          setFormData({
            id: product.id,
            name: product.name,
            category: product.category,
            price: String(product.price),
            stock: String(product.stock),
            minStock: String(product.minStock),
            unit: product.unit,
            description: product.description || ''
          });
          setFormErrors({});
          setIsFormOpen(true);
        };

        const closeForm = () => {
          setIsFormOpen(false);
          setEditingProduct(null);
          setFormData({ ...emptyFormData });
          setFormErrors({});
        };

        const handleInputChange = (event) => {
          const { name, value } = event.target;
          setFormData((prev) => ({ ...prev, [name]: value }));
          setFormErrors((prev) => ({ ...prev, [name]: '' }));
        };

        const handleSaveProduct = (event) => {
          event.preventDefault();

          const errors = validateProduct(formData);
          if (Object.keys(errors).length > 0) {
            setFormErrors(errors);
            showToast('Harap periksa form sebelum menyimpan.', 'error');
            return;
          }

          const normalized = {
            id: formData.id.trim().toUpperCase(),
            name: formData.name.trim(),
            category: formData.category.trim(),
            price: safeNumber(formData.price, 0),
            stock: safeNumber(formData.stock, 0),
            minStock: safeNumber(formData.minStock, 0),
            unit: formData.unit.trim() || 'pcs',
            description: formData.description.trim()
          };

          const hasDuplicateId = products.some((item) => {
            if (editingProduct && item.id === editingProduct.id) return false;
            return item.id.toUpperCase() === normalized.id.toUpperCase();
          });

          if (hasDuplicateId) {
            setFormErrors((prev) => ({ ...prev, id: 'ID produk sudah digunakan.' }));
            showToast('ID produk sudah digunakan.', 'error');
            return;
          }

          setProducts((prev) => {
            if (editingProduct) {
              return prev.map((item) => item.id === editingProduct.id ? normalized : item);
            }
            return [normalized, ...prev];
          });

          showToast(editingProduct ? 'Produk berhasil diperbarui.' : 'Produk berhasil ditambahkan.');
          closeForm();
        };

        const handleQuickStock = (id, delta) => {
          setProducts((prev) =>
            prev.map((item) => {
              if (item.id !== id) return item;
              const nextStock = Math.max(0, safeNumber(item.stock, 0) + delta);
              return { ...item, stock: nextStock };
            })
          );
        };

        const handleDeleteProduct = (id) => {
          setProducts((prev) => prev.filter((item) => item.id !== id));
          setDeleteId(null);
          showToast('Produk berhasil dihapus.');
        };

        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-100 via-slate-50 to-blue-50 p-4 md:p-8">
            <div className="mx-auto max-w-7xl">
              <header className="mb-6 rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-200">
                <div className="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
                  <div>
                    <p className="text-sm font-medium uppercase tracking-[0.15em] text-sky-600">Dashboard Inventory</p>
                    <h1 className="mt-1 text-2xl font-bold text-slate-800 md:text-3xl">Oriflame Inventory System</h1>
                  </div>
                  <button
                    type="button"
                    onClick={openCreateForm}
                    className="inline-flex items-center justify-center gap-2 rounded-xl bg-sky-600 px-4 py-2.5 font-medium text-white shadow-sm transition hover:bg-sky-700"
                  >
                    <Icon name="plus" size={16} className="text-white" />
                    Tambah Produk
                  </button>
                </div>
              </header>

              <section className="mb-6 grid gap-4 md:grid-cols-2 xl:grid-cols-4">
                {[
                  { label: 'Total SKU', value: stats.totalSKU, icon: 'box', color: 'bg-blue-100 text-blue-700' },
                  { label: 'Total Item', value: stats.totalItems, icon: 'package', color: 'bg-violet-100 text-violet-700' },
                  { label: 'Nilai Stok', value: formatRupiah(stats.totalValue), icon: 'wallet', color: 'bg-emerald-100 text-emerald-700' },
                  { label: 'Low Stock', value: stats.lowStockCount, icon: 'alert-triangle', color: 'bg-amber-100 text-amber-700' }
                ].map((card) => (
                  <div key={card.label} className="glass-panel rounded-2xl border border-slate-200 p-4 shadow-sm">
                    <div className="flex items-center justify-between">
                      <div>
                        <p className="text-sm text-slate-500">{card.label}</p>
                        <p className="mt-2 text-2xl font-bold text-slate-800">{card.value}</p>
                      </div>
                      <div className={`rounded-xl p-2 ${card.color}`}>
                        <Icon name={card.icon} size={20} />
                      </div>
                    </div>
                  </div>
                ))}
              </section>

              <section className="mb-6 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-200">
                <div className="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
                  <div className="relative w-full max-w-md">
                    <Icon name="search" size={16} className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                    <input
                      type="text"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="Cari berdasarkan nama atau ID..."
                      className="w-full rounded-xl border border-slate-200 bg-slate-50 py-2.5 pl-10 pr-3 text-sm outline-none transition focus:border-sky-400 focus:bg-white"
                    />
                  </div>

                  <div className="flex flex-wrap gap-2">
                    {categories.map((category) => (
                      <button
                        key={category}
                        type="button"
                        onClick={() => setSelectedCategory(category)}
                        className={`rounded-full px-3 py-1.5 text-sm font-medium transition ${
                          selectedCategory === category
                            ? 'bg-sky-600 text-white shadow-sm'
                            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                        }`}
                      >
                        {category}
                      </button>
                    ))}
                  </div>
                </div>
              </section>

              <section className="overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-slate-200">
                <div className="overflow-x-auto">
                  <table className="min-w-full divide-y divide-slate-200">
                    <thead className="bg-slate-50">
                      <tr>
                        <th className="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Produk</th>
                        <th className="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Kategori</th>
                        <th className="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Harga</th>
                        <th className="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Stok</th>
                        <th className="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Status</th>
                        <th className="px-4 py-3 text-right text-xs font-semibold uppercase tracking-wide text-slate-500">Aksi</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-200 bg-white">
                      {filteredProducts.length === 0 ? (
                        <tr>
                          <td colSpan="6" className="px-4 py-12 text-center text-slate-500">
                            Tidak ada produk yang cocok dengan filter saat ini.
                          </td>
                        </tr>
                      ) : (
                        filteredProducts.map((product) => {
                          const isLowStock = safeNumber(product.stock, 0) <= safeNumber(product.minStock, 0);

                          return (
                            <tr key={product.id} className="transition hover:bg-slate-50">
                              <td className="px-4 py-4">
                                <div className="flex items-center gap-3">
                                  <div className="flex h-10 w-10 items-center justify-center rounded-xl bg-sky-100 text-sky-700">
                                    <Icon name="package" size={18} />
                                  </div>
                                  <div>
                                    <p className="font-semibold text-slate-800">{product.name}</p>
                                    <p className="text-xs text-slate-500">{product.id}</p>
                                  </div>
                                </div>
                              </td>
                              <td className="px-4 py-4 text-sm text-slate-600">{product.category}</td>
                              <td className="px-4 py-4 text-sm font-medium text-slate-800">{formatRupiah(product.price)}</td>
                              <td className="px-4 py-4">
                                <div className="flex items-center gap-2">
                                  <button
                                    type="button"
                                    onClick={() => handleQuickStock(product.id, -1)}
                                    className="flex h-7 w-7 items-center justify-center rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-100"
                                    aria-label={`Kurangi stok ${product.name}`}
                                  >
                                    <Icon name="minus" size={14} />
                                  </button>
                                  <span className="min-w-12 text-center text-sm font-semibold text-slate-800">{product.stock}</span>
                                  <button
                                    type="button"
                                    onClick={() => handleQuickStock(product.id, 1)}
                                    className="flex h-7 w-7 items-center justify-center rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-100"
                                    aria-label={`Tambah stok ${product.name}`}
                                  >
                                    <Icon name="plus" size={14} />
                                  </button>
                                </div>
                              </td>
                              <td className="px-4 py-4">
                                <span
                                  className={`inline-flex rounded-full px-2.5 py-1 text-xs font-semibold ${
                                    isLowStock
                                      ? 'bg-amber-100 text-amber-700'
                                      : 'bg-emerald-100 text-emerald-700'
                                  }`}
                                >
                                  {isLowStock ? 'Low Stock' : 'Healthy'}
                                </span>
                              </td>
                              <td className="px-4 py-4">
                                <div className="flex items-center justify-end gap-2">
                                  <button
                                    type="button"
                                    onClick={() => openEditForm(product)}
                                    className="rounded-lg border border-slate-200 p-2 text-slate-600 transition hover:bg-slate-100"
                                    aria-label={`Edit ${product.name}`}
                                  >
                                    <Icon name="pencil" size={16} />
                                  </button>
                                  <button
                                    type="button"
                                    onClick={() => setDeleteId(product.id)}
                                    className="rounded-lg border border-red-200 bg-red-50 p-2 text-red-600 transition hover:bg-red-100"
                                    aria-label={`Hapus ${product.name}`}
                                  >
                                    <Icon name="trash-2" size={16} />
                                  </button>
                                </div>
                              </td>
                            </tr>
                          );
                        })
                      )}
                    </tbody>
                  </table>
                </div>
              </section>
            </div>

            {isFormOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/40 p-4">
                <div className="w-full max-w-2xl rounded-2xl bg-white p-6 shadow-2xl ring-1 ring-slate-200">
                  <div className="mb-5 flex items-center justify-between">
                    <h2 className="text-xl font-bold text-slate-800">
                      {editingProduct ? 'Edit Produk' : 'Tambah Produk Baru'}
                    </h2>
                    <button
                      type="button"
                      onClick={closeForm}
                      className="rounded-lg p-2 text-slate-500 transition hover:bg-slate-100 hover:text-slate-800"
                    >
                      <Icon name="x" size={18} />
                    </button>
                  </div>

                  <form onSubmit={handleSaveProduct} className="space-y-4">
                    <div className="grid gap-4 md:grid-cols-2">
                      <div>
                        <label className="mb-1 block text-sm font-medium text-slate-700">ID Produk</label>
                        <input
                          type="text"
                          name="id"
                          value={formData.id}
                          onChange={handleInputChange}
                          placeholder="ORI-009"
                          className={`w-full rounded-xl border bg-slate-50 px-3 py-2.5 text-sm outline-none transition ${formErrors.id ? 'border-red-300 focus:border-red-400' : 'border-slate-200 focus:border-sky-400 focus:bg-white'}`}
                        />
                        {formErrors.id && <p className="mt-1 text-xs text-red-500">{formErrors.id}</p>}
                      </div>

                      <div>
                        <label className="mb-1 block text-sm font-medium text-slate-700">Nama Produk</label>
                        <input
                          type="text"
                          name="name"
                          value={formData.name}
                          onChange={handleInputChange}
                          placeholder="Nama produk"
                          className={`w-full rounded-xl border bg-slate-50 px-3 py-2.5 text-sm outline-none transition ${formErrors.name ? 'border-red-300 focus:border-red-400' : 'border-slate-200 focus:border-sky-400 focus:bg-white'}`}
                        />
                        {formErrors.name && <p className="mt-1 text-xs text-red-500">{formErrors.name}</p>}
                      </div>

                      <div>
                        <label className="mb-1 block text-sm font-medium text-slate-700">Kategori</label>
                        <select
                          name="category"
                          value={formData.category}
                          onChange={handleInputChange}
                          className={`w-full rounded-xl border bg-slate-50 px-3 py-2.5 text-sm outline-none transition ${formErrors.category ? 'border-red-300 focus:border-red-400' : 'border-slate-200 focus:border-sky-400 focus:bg-white'}`}
                        >
                          {DEFAULT_CATEGORIES.filter((cat) => cat !== 'Semua').map((category) => (
                            <option key={category} value={category}>{category}</option>
                          ))}
                        </select>
                        {formErrors.category && <p className="mt-1 text-xs text-red-500">{formErrors.category}</p>}
                      </div>

                      <div>
                        <label className="mb-1 block text-sm font-medium text-slate-700">Satuan</label>
                        <input
                          type="text"
                          name="unit"
                          value={formData.unit}
                          onChange={handleInputChange}
                          placeholder="pcs / botol"
                          className={`w-full rounded-xl border bg-slate-50 px-3 py-2.5 text-sm outline-none transition ${formErrors.unit ? 'border-red-300 focus:border-red-400' : 'border-slate-200 focus:border-sky-400 focus:bg-white'}`}
                        />
                        {formErrors.unit && <p className="mt-1 text-xs text-red-500">{formErrors.unit}</p>}
                      </div>

                      <div>
                        <label className="mb-1 block text-sm font-medium text-slate-700">Harga</label>
                        <input
                          type="number"
                          name="price"
                          min="1"
                          value={formData.price}
                          onChange={handleInputChange}
                          className={`w-full rounded-xl border bg-slate-50 px-3 py-2.5 text-sm outline-none transition ${formErrors.price ? 'border-red-300 focus:border-red-400' : 'border-slate-200 focus:border-sky-400 focus:bg-white'}`}
                        />
                        {formErrors.price && <p className="mt-1 text-xs text-red-500">{formErrors.price}</p>}
                      </div>

                      <div>
                        <label className="mb-1 block text-sm font-medium text-slate-700">Stok</label>
                        <input
                          type="number"
                          name="stock"
                          min="0"
                          value={formData.stock}
                          onChange={handleInputChange}
                          className={`w-full rounded-xl border bg-slate-50 px-3 py-2.5 text-sm outline-none transition ${formErrors.stock ? 'border-red-300 focus:border-red-400' : 'border-slate-200 focus:border-sky-400 focus:bg-white'}`}
                        />
                        {formErrors.stock && <p className="mt-1 text-xs text-red-500">{formErrors.stock}</p>}
                      </div>

                      <div className="md:col-span-2">
                        <label className="mb-1 block text-sm font-medium text-slate-700">Minimal Stok</label>
                        <input
                          type="number"
                          name="minStock"
                          min="0"
                          value={formData.minStock}
                          onChange={handleInputChange}
                          className={`w-full rounded-xl border bg-slate-50 px-3 py-2.5 text-sm outline-none transition ${formErrors.minStock ? 'border-red-300 focus:border-red-400' : 'border-slate-200 focus:border-sky-400 focus:bg-white'}`}
                        />
                        {formErrors.minStock && <p className="mt-1 text-xs text-red-500">{formErrors.minStock}</p>}
                      </div>

                      <div className="md:col-span-2">
                        <label className="mb-1 block text-sm font-medium text-slate-700">Deskripsi</label>
                        <textarea
                          name="description"
                          value={formData.description}
                          onChange={handleInputChange}
                          rows="4"
                          placeholder="Deskripsi produk..."
                          className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none transition focus:border-sky-400 focus:bg-white"
                        ></textarea>
                      </div>
                    </div>

                    <div className="flex items-center justify-end gap-3 pt-2">
                      <button
                        type="button"
                        onClick={closeForm}
                        className="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-slate-600 transition hover:bg-slate-100"
                      >
                        Batal
                      </button>
                      <button
                        type="submit"
                        className="rounded-xl bg-sky-600 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-sky-700"
                      >
                        {editingProduct ? 'Simpan Perubahan' : 'Tambah Produk'}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {deleteId && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/40 p-4">
                <div className="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl ring-1 ring-slate-200">
                  <div className="mb-4 flex items-center gap-3">
                    <div className="rounded-xl bg-red-100 p-2 text-red-600">
                      <Icon name="trash-2" size={20} />
                    </div>
                    <div>
                      <h3 className="text-lg font-bold text-slate-800">Hapus Produk</h3>
                      <p className="text-sm text-slate-500">Apakah Anda yakin ingin menghapus produk ini?</p>
                    </div>
                  </div>

                  <div className="mt-5 flex justify-end gap-3">
                    <button
                      type="button"
                      onClick={() => setDeleteId(null)}
                      className="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-slate-600 transition hover:bg-slate-100"
                    >
                      Batal
                    </button>
                    <button
                      type="button"
                      onClick={() => handleDeleteProduct(deleteId)}
                      className="rounded-xl bg-red-600 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-red-700"
                    >
                      Hapus
                    </button>
                  </div>
                </div>
              </div>
            )}

            {toast && (
              <div className="fixed bottom-5 right-5 z-[60]">
                <div
                  className={`rounded-xl px-4 py-3 text-sm font-medium shadow-lg ${
                    toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-slate-800 text-white'
                  }`}
                >
                  {toast.message}
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
